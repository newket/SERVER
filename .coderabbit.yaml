language: ko-KR

reviews:
  profile: assertive

  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "**/*"
      instructions:
      - "모든 리뷰 코멘트는 한국어로 작성한다."
      - "실제 버그나 장애로 이어질 수 있는 문제를 우선적으로 지적한다."
      - "불필요한 코드 스타일 지적은 하지 않는다."
      - "성능 및 데이터베이스 쿼리 최적화를 검토한다."
      - "동시성 문제와 데이터 정합성을 검토한다."
      - "기존 프로젝트의 아키텍처와 설계 원칙을 존중한다."

  poem: false
chat:
  auto_reply: true